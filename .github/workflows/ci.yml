name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # macOS ships Python 3.9 (the code targets it, see pyproject.toml); 3.9 isn't on current Ubuntu runners.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test (generator invariants, patterns, bin/learn)
        run: pytest -q
      # Signing (shortcuts sign) needs macOS and an Apple account; it is a release step on the Mac.
