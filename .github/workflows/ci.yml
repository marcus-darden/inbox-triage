name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test (generator invariants, patterns, bin/learn)
        run: pytest -q
      # Signing (shortcuts sign) needs macOS and an Apple account; it is a release step on the Mac.
