<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Inbox Triage review test</title>
<!-- Test page: reads made-up messages from the URL fragment (never sent to the server), makes no
     network requests, and hands the chosen decisions back to the IT Return shortcut. -->
<style>
  :root { color-scheme: dark; }
  body { font: 16px -apple-system, system-ui, sans-serif; margin: 0 16px 96px; background: #111; color: #eee; }
  #status { font-size: 20px; font-weight: 700; color: #f55; margin: 16px 0 4px; }
  #info { color: #aaa; font-size: 14px; }
  .card { border: 1px solid #333; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .card.set { border-color: #e8b400; }
  .meta { color: #aaa; font-size: 13px; margin: 2px 0 6px; }
  .sum { color: #ccc; font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 14px; padding: 8px 10px; border: 0; border-radius: 8px; background: #2a2a2a; color: #eee; }
  button.on { background: #e8b400; color: #000; }
  input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px; font: inherit; font-size: 14px;
          background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 8px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #111e; border-top: 1px solid #333; }
  #submit { width: 100%; font-size: 17px; padding: 12px; background: #0a84ff; color: #fff; }
</style>
</head>
<body>
<div id="status">Script did NOT run ✗</div>
<div id="info"></div>
<div id="cards"></div>
<div id="bar"><button id="submit">Submit 0 decisions</button></div>
<script>
"use strict";
const CODES = [["k", "keep"], ["a", "archive"], ["d", "delete"], ["l", "low"], ["m", "moderate"],
               ["h", "high"], ["c", "confirm"], ["u", "unsub"]];
const RETURN = "shortcuts://run-shortcut?name=IT%20Return&input=text&text=";
const chosen = {};   // id -> {code, hint}
const $ = (id) => document.getElementById(id);

function b64urlBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}

async function decode(hash) {
  let bytes = b64urlBytes(hash);
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {   // gzip, from Shortcuts' Make Archive
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(msgs) {
  const box = $("cards");
  msgs.forEach((m) => {
    const card = el("div", "card");
    card.append(el("b", "", m.n + ". " + m.from), el("div", "", m.subject),
                el("div", "meta", m.decision + " · id:" + m.id));
    if (m.summary) card.append(el("div", "sum", m.summary));
    const row = el("div", "row");
    CODES.forEach(([code, label]) => {
      const bt = el("button", "", label);
      bt.onclick = () => {
        const cur = chosen[m.id];
        if (cur && cur.code === code) delete chosen[m.id];          // tap again to clear
        else chosen[m.id] = { code, hint: hint.value.replace(/\)/g, "").trim() };
        row.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
        if (chosen[m.id]) bt.classList.add("on");
        card.classList.toggle("set", !!chosen[m.id]);
        update();
      };
      row.append(bt);
    });
    const hint = el("input");
    hint.placeholder = "optional hint for the rules";
    hint.oninput = () => { if (chosen[m.id]) chosen[m.id].hint = hint.value.replace(/\)/g, "").trim(); };
    card.append(row, hint);
    box.append(card);
  });
}

function payload() {
  const lines = Object.entries(chosen).map(([id, c]) => "x" + c.code + (c.hint ? " " + c.hint : "") + ") id:" + id);
  return "IT-TEST " + new Date().toLocaleTimeString() + "\n" + lines.join("\n");
}

function update() {
  const n = Object.keys(chosen).length;
  $("submit").textContent = "Submit " + n + " decision" + (n === 1 ? "" : "s");
}

$("submit").onclick = () => { location.href = RETURN + encodeURIComponent(payload()); };

(async () => {
  const status = $("status");
  status.textContent = "Script ran ✓";
  status.style.color = "#5f5";
  const hash = location.hash.slice(1);
  if (!hash) { $("info").textContent = "No data in the link (nothing after #)."; return; }
  try {
    const msgs = await decode(hash);
    $("info").textContent = "Payload " + hash.length + " characters, " + msgs.length + " messages decoded.";
    render(msgs);
  } catch (e) {
    $("info").textContent = "Couldn't decode the data: " + e.message;
  }
})();
</script>
</body>
</html>
