<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Inbox Triage review</title>
<!--
  The Inbox Triage review page. The Engine opens it with the run's report after the "#":
  #v1.<base64url of a zip, gzip or plain UTF-8 report>. Browsers never send the part after "#" to the
  server, and this page makes no network requests (see the CSP above). Submit hands the chosen
  corrections to the InboxTriage shortcut as report lines tagged "x?<hint>)", the same format typed in
  a Notes report, so one parser handles both.
-->
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #6b6b70; --line: #d8d8dd; --chip: #e9e9ee;
          --accent: #0a62d6; --on: #e8b400; --on-text: #000; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #9a9aa0; --line: #333; --chip: #2c2c2e;
            --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: 0 16px 120px; }
  header { padding: 16px 0 4px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .muted { color: var(--muted); font-size: 14px; margin: 2px 0; }
  .card { background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 12px; margin: 10px 0; }
  .card.set { border-color: var(--on); }
  .chip { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--chip);
          color: var(--accent); margin: 2px 0 4px; }
  .chip[hidden] { display: none; }
  .who { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .sum { font-size: 14px; margin: 6px 0; white-space: pre-wrap; color: var(--text); }
  .sum > summary { color: var(--accent); min-height: 32px; line-height: 32px; }
  .links a { color: var(--accent); font-size: 14px; margin-right: 14px; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; margin-top: 10px; }
  button { font: inherit; font-size: 14px; min-height: 44px; border: 0; border-radius: 10px;
           background: var(--chip); color: var(--text); }
  button.current { outline: 1px solid var(--muted); }
  button.on { background: var(--on); color: var(--on-text); font-weight: 600; }
  input { width: 100%; margin-top: 8px; padding: 10px; font: inherit; font-size: 16px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  details { margin: 16px 0; color: var(--muted); font-size: 14px; white-space: pre-wrap; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
         background: var(--bg); border-top: 1px solid var(--line); }
  #submit { width: 100%; min-height: 50px; font-size: 17px; font-weight: 600; background: var(--accent); color: #fff; }
  #submit:disabled { opacity: .45; }
  #error { color: #d33; }
</style>
</head>
<body>
<header>
  <h1 id="title">Inbox Triage review</h1>
  <div id="summary" class="muted"></div>
  <div id="help" class="muted">A correction without a hint changes that message only. Add a hint if you want it to become a rule. Start a hint with a tag and a semicolon (LoR; student asking for a letter) to add that Gmail label.</div>
  <div id="error"></div>
</header>
<main id="cards"></main>
<div id="bar"><button id="submit" disabled>Submit 0 corrections</button></div>
<script>
"use strict";

// ---- pure functions (tested in tests/review.test.mjs) ----

const CODES = [["k", "Keep"], ["a", "Archive"], ["d", "Delete"], ["l", "Low"], ["m", "Moderate"],
               ["h", "High"], ["c", "Confirm"], ["u", "Unsub"], ["r", "Release"]];
const RETURN_URL = "shortcuts://run-shortcut?name=InboxTriage&input=text&text=";
// "Sender — Subject · DECISION·level · op · src[ · #tag] · id:<id>", the Engine's report line.
const ITEM_RE = /^(.*) · ([A-Z]+)(?:·([a-z]+))? · (\S+) · (\S+)(?: · #([A-Za-z0-9_-]+))? · id:(\S+)\s*$/;
// A hint that starts with "Tag;" labels the message in Gmail; the rest is the hint for the rules.
const TAG_RE = /^\s*([A-Za-z0-9_-]{1,24})\s*;/;

function base64urlBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/").replace(/[^A-Za-z0-9+/]/g, "");
  while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}

async function inflate(bytes, format) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// The first file in a zip (Shortcuts' Make Archive). Sizes come from the central directory, because
// the local header may defer them to a data descriptor.
async function unzipFirst(bytes) {
  const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = bytes.length - 22;
  while (eocd >= 0 && v.getUint32(eocd, true) !== 0x06054b50) eocd--;
  if (eocd < 0) throw new Error("zip: no end of central directory");
  const cd = v.getUint32(eocd + 16, true);
  const method = v.getUint16(cd + 10, true);
  const size = v.getUint32(cd + 20, true);
  const local = v.getUint32(cd + 42, true);
  const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
  const data = bytes.subarray(start, start + size);
  if (method === 0) return data;
  if (method === 8) return inflate(data, "deflate-raw");
  throw new Error("zip: compression method " + method);
}

// "#v1.<base64url>" → report text. The bytes may be a zip, gzip or plain UTF-8.
async function decodePayload(hash) {
  const m = /^#?v1\.(.+)$/s.exec(hash);
  if (!m) throw new Error("no report in the link");
  let bytes = base64urlBytes(m[1]);
  if (bytes[0] === 0x50 && bytes[1] === 0x4b) bytes = await unzipFirst(bytes);
  else if (bytes[0] === 0x1f && bytes[1] === 0x8b) bytes = await inflate(bytes, "gzip");
  return new TextDecoder().decode(bytes);
}

function parseItem(line) {
  const m = ITEM_RE.exec(line.trim());
  if (!m) return null;
  const dash = m[1].indexOf(" — ");
  return { line: line.trim(), sender: dash < 0 ? m[1] : m[1].slice(0, dash),
           subject: dash < 0 ? "" : m[1].slice(dash + 3), decision: m[2], level: m[3] || "",
           op: m[4], src: m[5], tag: m[6] || "", id: m[7], summary: "", mail: "" };
}

// The Engine's Markdown report (or the Kept view) → {title, info, sections: [{heading, items, text}]}.
function parseReport(text) {
  const out = { title: "", info: [], sections: [] };
  let section = null, item = null;
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const line = raw.trim();
    if (!line) { item = null; continue; }
    if (line.startsWith("# ") && !out.title) { out.title = line.slice(2); continue; }
    if (line.startsWith("## ")) {
      section = { heading: line.slice(3), items: [], text: [] };
      out.sections.push(section);
      item = null;
      continue;
    }
    if (line.startsWith("**Feedback:**") || line.startsWith("[Review")) continue;
    const it = parseItem(line);
    if (it) {
      if (!section) { section = { heading: "Messages", items: [], text: [] }; out.sections.push(section); }
      section.items.push(it);
      item = it;
      continue;
    }
    if (item && line.startsWith("[Open in Mail]")) {
      const mail = /\[Open in Mail\]\(([^)]+)\)/.exec(line);
      item.mail = mail ? mail[1] : "";
      continue;
    }
    if (item) { item.summary += (item.summary ? "\n" : "") + line; continue; }
    if (section) { if (line !== "None") section.text.push(line); continue; }
    out.info.push(line);
  }
  return out;
}

// One correction → the line the Notes feedback parser reads: "xa a hint) <report line>".
function feedbackLine(code, hint, itemLine) {
  const h = (hint || "").replace(/[)\n\r]/g, " ").replace(/\s+/g, " ").trim();
  return "x" + code + (h ? " " + h : "") + ") " + itemLine;
}

function tagOf(hint) {
  const m = TAG_RE.exec(hint || "");
  return m ? m[1] : "";
}

// Decisions chosen with buttons (id -> {code, line}), plus hints typed on cards (id -> {hint, line}).
// A card with a tag in its hint and no button is a tag-only correction (code t).
function buildChoices(chosen, hints) {
  const out = [];
  for (const [id, c] of chosen) out.push({ code: c.code, hint: (hints.get(id) || {}).hint || "", line: c.line });
  for (const [id, h] of hints) {
    if (!chosen.has(id) && tagOf(h.hint)) out.push({ code: "t", hint: h.hint, line: h.line });
  }
  return out;
}

function submitText(title, choices) {
  const lines = choices.map((c) => feedbackLine(c.code, c.hint, c.line));
  return "Review page: " + (title || "Inbox Triage") + "\n" + lines.join("\n") + "\n";
}

function submitUrl(title, choices) {
  return RETURN_URL + encodeURIComponent(submitText(title, choices));
}

// ---- proposed rules (tested in tests/review.test.mjs; apply logic mirrors bin/learn's apply_rule) ----

const ACTIONS = ["KEEP", "ARCHIVE", "DELETE", "UNSUBSCRIBE", "SUMMARIZE"];
const LEVELS = ["low", "moderate", "high", "confirmations"];
const TAG_NAME_RE = /^[A-Za-z0-9_-]{1,24}$/;
const RULES_UPDATE = "RULES-UPDATE v1";

function isProposals(text) {
  return /^=== proposals ===$/m.test(text) && /^=== rules ===$/m.test(text);
}

// "=== proposals ===\n…\n=== rules ===\n…\n=== log ===\n…" → {title, proposals, rules, log}
function splitBundle(text) {
  const part = (name) => {
    const m = new RegExp("^=== " + name + " ===\\n([\\s\\S]*?)(?=^=== \\w+ ===$|(?![\\s\\S]))", "m").exec(text);
    return m ? m[1].trim() : "";
  };
  const title = /^# (.*)$/m.exec(text);
  return { title: title ? title[1] : "Proposed rules", proposals: part("proposals"), rules: part("rules"),
           log: part("log") };
}

function firstJson(text) {
  const t = (text || "").replace(/```(?:json)?/g, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("no JSON object");
  return JSON.parse(t.slice(a, b + 1));
}

// A proposal as a rules.json rule, or an error string. kind: "sender" or "content".
function normalize(kind, p) {
  if (!p || typeof p !== "object") return "not an object";
  const s = (v) => (typeof v === "string" ? v.trim() : "");
  const action = s(p.action).toUpperCase(), level = s(p.level).toLowerCase(), tag = s(p.tag);
  if (!ACTIONS.includes(action)) return "unknown action '" + s(p.action) + "'";
  if (action === "SUMMARIZE" && !LEVELS.includes(level)) return "SUMMARIZE needs a level";
  if (tag && !TAG_NAME_RE.test(tag)) return "bad tag '" + tag + "'";
  const rule = kind === "sender" ? { from: s(p.from), subject: s(p.subject) } : { keyword: s(p.keyword) };
  if (kind === "sender" && rule.from.length < 3) return "sender rule without 'from'";
  if (kind === "content" && rule.keyword.length < 3) return "content rule without 'keyword'";
  Object.assign(rule, { action, level: action === "SUMMARIZE" ? level : "", flag: "" });
  if (tag) rule.tag = tag;
  return rule;
}

// Locally AI's reply → [{kind, rule, reason}] plus [{kind, raw, error}] for proposals that can't be used.
function parseProposals(text) {
  const out = { ok: [], bad: [] };
  let j;
  try { j = firstJson(text); } catch (e) { out.bad.push({ kind: "", raw: text, error: e.message }); return out; }
  for (const [key, kind] of [["sender_rules", "sender"], ["content_rules", "content"]]) {
    for (const p of Array.isArray(j[key]) ? j[key] : []) {
      const r = normalize(kind, p);
      if (typeof r === "string") out.bad.push({ kind, raw: JSON.stringify(p), error: r });
      else out.ok.push({ kind, rule: r, reason: typeof p.reason === "string" ? p.reason : "" });
    }
  }
  return out;
}

function sameRule(kind, a, b) {
  const lc = (v) => (v || "").toLowerCase();
  if (kind === "content") return lc(a.keyword) === lc(b.keyword);
  return lc(a.from) === lc(b.from) && lc(a.subject) === lc(b.subject);
}

// Rules a new rule replaces: the same keyword, or the same from and subject (as bin/learn's apply_rule does).
// Broader rules stay: the new rule comes last and the last match wins, so it overrides them for its address only.
function replaced(rules, kind, rule) {
  const list = kind === "content" ? rules.content || [] : rules.rules || [];
  return list.filter((r) => sameRule(kind, r, rule));
}

function applyRules(rules, approved) {
  const out = JSON.parse(JSON.stringify(rules));
  out.rules = out.rules || [];
  out.content = out.content || [];
  for (const { kind, rule } of approved) {
    const key = kind === "content" ? "content" : "rules";
    const gone = replaced(out, kind, rule);
    out[key] = out[key].filter((r) => !gone.includes(r)).concat([rule]);
  }
  return out;
}

function ruleText(kind, r) {
  const what = r.action === "SUMMARIZE" ? "summarize (" + r.level + ")" : r.action.toLowerCase();
  const when = kind === "content" ? "Subject or preview contains “" + r.keyword + "”"
    : "Mail from " + r.from + (r.subject ? " with subject containing “" + r.subject + "”" : "");
  return when + " → " + what + (r.tag ? ", label #" + r.tag : "");
}

// JSON with every non-ASCII character escaped, so the shortcut's character count matches ours.
function asciiJson(obj) {
  return JSON.stringify(obj, null, 2).replace(/[\u007f-￿]/g,
    (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
}

function b64(text) {
  return btoa(text);   // text is ASCII (asciiJson / ASCII log lines)
}

// The text InboxTriage receives: header with the length, then base64 of the new rules.json and of the log.
function rulesUpdateText(newRules, logLines) {
  const json = asciiJson(newRules) + "\n";
  const log = logLines.map((l) => asciiJson(l).replace(/\n\s*/g, " ")).join("\n") + "\n";
  return RULES_UPDATE + " len=" + json.length + "\n" + b64(json) + "\n" + b64(log) + "\n";
}

function rulesUpdateUrl(newRules, logLines) {
  return RETURN_URL + encodeURIComponent(rulesUpdateText(newRules, logLines));
}

// Proposals rejected before (rules-log.txt lines with "decision": "rejected") don't come back.
function rejectedBefore(log) {
  const out = [];
  for (const line of (log || "").split("\n")) {
    try { const j = JSON.parse(line); if (j.decision === "rejected" && j.rule) out.push(j); } catch (e) { /* skip */ }
  }
  return out;
}

function wasRejected(rejected, kind, rule) {
  return rejected.some((j) => j.kind === kind && sameRule(kind, j.rule, rule) && j.rule.action === rule.action &&
                              (j.rule.level || "") === (rule.level || "") && (j.rule.tag || "") === (rule.tag || ""));
}

// ---- page ----

function boot() {
  const $ = (id) => document.getElementById(id);
  const chosen = new Map();   // id -> {code, line}
  const hints = new Map();    // id -> {hint, line}
  let report = { title: "", sections: [] };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function update() {
    const n = buildChoices(chosen, hints).length;
    $("submit").textContent = "Submit " + n + " correction" + (n === 1 ? "" : "s");
    $("submit").disabled = n === 0;
  }

  function card(it) {
    const c = el("div", "card");
    c.append(el("div", "who", it.sender), el("div", "", it.subject),
             el("div", "meta", it.decision + (it.level ? " " + it.level : "") + " · " + it.op + " · " + it.src));
    const chip = el("span", "chip", it.tag ? "#" + it.tag : "");
    chip.hidden = !it.tag;
    c.append(chip);
    if (it.summary) {   // collapsed by default to keep the page short
      const d = el("details", "sum");
      d.append(el("summary", "", "Summary"), el("div", "", it.summary));
      c.append(d);
    }
    const links = el("div", "links");
    if (it.mail) { const a = el("a", "", "Open in Mail"); a.href = it.mail; links.append(a); }
    if (links.childNodes.length) c.append(links);
    const current = { KEEP: "k", ARCHIVE: "a", DELETE: "d", UNSUBSCRIBE: "u" }[it.decision] ||
                    (it.decision === "SUMMARIZE" ? { low: "l", moderate: "m", high: "h", confirmations: "c" }[it.level] : "");
    const row = el("div", "row");
    const hint = el("input");
    hint.placeholder = "Optional hint to update rules";
    hint.autocomplete = "off";
    CODES.forEach(([code, label]) => {
      const b = el("button", code === current ? "current" : "", label);
      b.type = "button";
      b.onclick = () => {
        const prev = chosen.get(it.id);
        if (prev && prev.code === code) chosen.delete(it.id);
        else chosen.set(it.id, { code, line: it.line });
        row.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
        if (chosen.has(it.id)) b.classList.add("on");
        c.classList.toggle("set", chosen.has(it.id) || !!tagOf(hint.value));
        update();
      };
      row.append(b);
    });
    hint.oninput = () => {
      if (hint.value.trim()) hints.set(it.id, { hint: hint.value, line: it.line });
      else hints.delete(it.id);
      const t = tagOf(hint.value) || it.tag;
      chip.textContent = t ? "#" + t : "";
      chip.hidden = !t;
      c.classList.toggle("set", chosen.has(it.id) || !!tagOf(hint.value));
      update();
    };
    c.append(row, hint);
    return c;
  }

  function render() {
    $("title").textContent = report.title || "Inbox Triage review";
    document.title = report.title || "Inbox Triage review";
    const n = new Set(report.sections.flatMap((x) => x.items.map((it) => it.id))).size;
    $("summary").textContent = report.info.join(" ") + (report.info.length ? " " : "") + n + " messages to review.";
    const main = $("cards");
    // "Needs you" repeats messages that also appear under their decision: show each message once.
    const shown = new Set();
    for (const s of report.sections) {
      s.items = s.items.filter((it) => !shown.has(it.id) && shown.add(it.id));
    }
    for (const s of report.sections) {
      if (!s.items.length && !s.text.length) continue;
      if (s.items.length) {
        main.append(el("h2", "", s.heading + " (" + s.items.length + ")"));
        s.items.forEach((it) => main.append(card(it)));
      } else {
        const d = el("details");
        d.append(el("summary", "", s.heading), document.createTextNode(s.text.join("\n")));
        main.append(d);
      }
    }
  }

  $("submit").onclick = () => {
    const choices = buildChoices(chosen, hints);
    if (!choices.length) return;
    location.href = submitUrl(report.title, choices);
    $("submit").textContent = "Sent " + choices.length + " at " + new Date().toLocaleTimeString() + ". Submit again";
  };

  function renderProposals(bundle) {
    $("help").hidden = true;
    $("title").textContent = bundle.title;
    document.title = bundle.title;
    let rules;
    try { rules = firstJson(bundle.rules); } catch (e) { $("error").textContent = "Couldn't read rules.json: " + e.message; return; }
    const parsed = parseProposals(bundle.proposals);
    const rejected = rejectedBefore(bundle.log);
    const fresh = parsed.ok.filter((p) => !wasRejected(rejected, p.kind, p.rule));
    const skipped = parsed.ok.length - fresh.length;
    $("summary").textContent = fresh.length + " proposed rule" + (fresh.length === 1 ? "" : "s") +
      (skipped ? ", " + skipped + " hidden because you rejected them before" : "") +
      ". Nothing changes until you approve and save.";
    const decided = new Map();   // index -> "approved" | "rejected"
    const main = $("cards");
    fresh.forEach((p, i) => {
      const c = el("div", "card");
      c.append(el("div", "who", p.kind === "content" ? "Content rule" : "Sender rule"), el("div", "", ruleText(p.kind, p.rule)));
      if (p.reason) c.append(el("div", "meta", "From your hint: " + p.reason));
      const old = replaced(rules, p.kind, p.rule);
      c.append(el("div", "sum", old.length ? "Replaces: " + old.map((r) => ruleText(p.kind, r)).join("; ") : "New rule"));
      const row = el("div", "row");
      for (const [label, value] of [["Approve", "approved"], ["Reject", "rejected"]]) {
        const b = el("button", "", label);
        b.type = "button";
        b.onclick = () => {
          if (decided.get(i) === value) decided.delete(i); else decided.set(i, value);
          row.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
          if (decided.get(i) === value) b.classList.add("on");
          c.classList.toggle("set", decided.has(i));
          const n = decided.size;
          $("submit").textContent = "Save " + n + " decision" + (n === 1 ? "" : "s");
          $("submit").disabled = n === 0;
        };
        row.append(b);
      }
      c.append(row);
      main.append(c);
    });
    if (parsed.bad.length) {
      const d = el("details");
      d.append(el("summary", "", parsed.bad.length + " proposal(s) couldn't be used"),
               document.createTextNode(parsed.bad.map((b) => b.error + ": " + b.raw).join("\n")));
      main.append(d);
    }
    $("submit").textContent = "Save 0 decisions";
    $("submit").onclick = () => {
      if (!decided.size) return;
      const time = new Date().toISOString();
      const approved = [], log = [];
      for (const [i, decision] of decided) {
        const p = fresh[i];
        if (decision === "approved") approved.push(p);
        log.push({ time, decision, kind: p.kind, rule: p.rule, reason: p.reason });
      }
      location.href = rulesUpdateUrl(applyRules(rules, approved), log);
      $("submit").textContent = "Sent at " + new Date().toLocaleTimeString() + ". Save again";
    };
  }

  decodePayload(location.hash)
    .then((text) => {
      if (isProposals(text)) { renderProposals(splitBundle(text)); return; }
      report = parseReport(text); render(); update();
    })
    .catch((e) => { $("error").textContent = "Couldn't read the report: " + e.message +
                    ". Open this page from the Inbox Triage shortcut."; });
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
