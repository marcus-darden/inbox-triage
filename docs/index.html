<h1>Inbox Triage</h1>
<p>Inbox Triage is a personal Apple Shortcut that uses the on-device Apple Intelligence model to sort its owner's own Gmail inbox. It archives or trashes messages whose content is in the past or irrelevant. It has a single user and is not offered to anyone else.</p>
